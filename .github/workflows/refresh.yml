name: Refresh EIA data

on:
  schedule:
    # Weekly — EIA's monthly publish day isn't fixed, so we just poll.
    - cron: '17 13 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest EIA data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node pipeline/fetch.mjs

      - name: Commit if data changed
        run: |
          if git diff --quiet -- public/data/energy.json; then
            echo "No data change."
            exit 0
          fi
          git config user.name "grid-notebook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/energy.json
          git commit -m "data: refresh EIA generation survey"
          git push

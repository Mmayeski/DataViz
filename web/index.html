<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>DataViz — Sensor-Driven Charts</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Permission overlay (iOS requires user gesture for sensors + camera) -->
        <div id="permission-overlay" class="overlay">
            <div class="overlay-content">
                <h1>DataViz</h1>
                <p>Sensor-Driven Temperature Visualization</p>
                <p class="subtitle">Tilt, shake, and move your phone to explore Baltimore's climate data.</p>
                <button id="start-btn" class="primary-btn">Enable Sensors &amp; Start</button>
                <p class="hint">Requires motion sensors &amp; camera access</p>
            </div>
        </div>

        <!-- Main app UI -->
        <div id="main-ui" class="hidden">
            <!-- Header -->
            <header>
                <h1>Baltimore, MD</h1>
                <h2>Average High Temperature</h2>
            </header>

            <!-- 3D brain-map canvas (full viewport, sits behind HUD) -->
            <canvas id="brain-canvas"></canvas>

            <!-- Camera preview (small, for face detection) -->
            <video id="camera-preview" autoplay playsinline muted></video>

            <!-- Sensor state overlay (HUD) -->
            <div id="sensor-hud">
                <div class="hud-row">
                    <span class="hud-icon" id="hud-sort-icon">→</span>
                    <span id="hud-sort-label">Chronological</span>
                </div>
                <div class="hud-row">
                    <span class="hud-icon">📅</span>
                    <span id="hud-filter-label">All Months</span>
                </div>
                <div class="hud-row">
                    <span class="hud-icon" id="hud-face-icon">😶‍🌫️</span>
                    <span id="hud-face-label">No face detected</span>
                </div>
                <div class="hud-row">
                    <span class="hud-icon" id="hud-chart-icon">📊</span>
                    <span id="hud-chart-label">Bar · Temperature</span>
                </div>
            </div>

            <!-- Fallback controls (shown on desktop or when sensors unavailable) -->
            <div id="fallback-controls" class="hidden">
                <p class="fallback-title">Manual Controls</p>
                <div class="control-row">
                    <label>Roll (sort)</label>
                    <input type="range" id="manual-roll" min="-100" max="100" value="0">
                </div>
                <div class="control-row">
                    <label>Pitch (filter)</label>
                    <input type="range" id="manual-pitch" min="-100" max="100" value="0">
                </div>
                <div class="control-row">
                    <label>Zoom</label>
                    <input type="range" id="manual-zoom" min="0" max="100" value="100">
                </div>
                <button id="manual-shake" class="secondary-btn">Simulate Shake</button>
            </div>
        </div>
    </div>

    <!-- App modules -->
    <script type="module" src="js/sensor-smoothing.js"></script>
    <script type="module" src="js/temperature-data.js"></script>
    <script type="module" src="js/chart-config.js"></script>
    <script type="module" src="js/tilt-sensor.js"></script>
    <script type="module" src="js/shake-sensor.js"></script>
    <script type="module" src="js/proximity-sensor.js"></script>
    <script type="module" src="js/chart-manager.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- Register service worker for PWA / offline support -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>

name: DataViz
options:
  bundleIdPrefix: com.dataviz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only

targets:
  DataViz:
    type: application
    platform: iOS
    sources:
      - path: DataViz
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DataViz/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dataviz.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: DataViz/App/Info.plist
      properties: {}
